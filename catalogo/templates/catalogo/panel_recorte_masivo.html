<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reparación y Encuadre · DSCLUB</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-neutral-950 text-white min-h-screen flex items-center justify-center p-6">
    <div class="max-w-xl w-full bg-neutral-900 border border-neutral-800 p-6 space-y-5">
        <div class="flex items-center justify-between">
            <h1 class="text-sm font-bold uppercase tracking-widest">Reparar Opacidad y Tamaño en Lote</h1>
            <a href="{% url 'panel_lista' %}" class="text-xs text-neutral-400 hover:text-white underline">Volver al panel</a>
        </div>

        <p class="text-xs text-neutral-400 leading-relaxed">
            Solidificará las zonas interiores lavadas (como jeans claros) y ajustará el tamaño óptimo de las <strong class="text-white">{{ total }}</strong> prendas sin volver a ejecutar el borrado de fondo.
        </p>

        <div class="space-y-2">
            <div class="flex justify-between text-xs font-semibold">
                <span id="status-text">Listo para iniciar</span>
                <span id="counter-text">0 / {{ total }}</span>
            </div>
            <div class="w-full h-2 bg-neutral-800 overflow-hidden">
                <div id="progress-bar" class="h-full bg-emerald-500 w-0 transition-all duration-300"></div>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <img id="preview-img" src="" alt="" class="w-20 h-24 object-contain bg-neutral-800 border border-neutral-700 hidden">
            <div id="log-box" class="flex-1 h-24 overflow-y-auto bg-black/50 p-2.5 text-[11px] font-mono text-neutral-300 space-y-1">
                <div>Esperando inicio...</div>
            </div>
        </div>

        {% csrf_token %}
        <button id="start-btn" type="button"
            class="w-full bg-white text-black py-3 text-xs font-bold uppercase tracking-widest hover:bg-neutral-200 transition-colors cursor-pointer disabled:opacity-50">
            Reparar y ajustar {{ total }} prendas
        </button>
    </div>

    <script id="items-data" type="application/json">{{ items_json|safe }}</script>

    <script>
        const ITEMS = JSON.parse(document.getElementById('items-data').textContent || '[]');
        const startBtn = document.getElementById('start-btn');
        const statusText = document.getElementById('status-text');
        const counterText = document.getElementById('counter-text');
        const progressBar = document.getElementById('progress-bar');
        const previewImg = document.getElementById('preview-img');
        const logBox = document.getElementById('log-box');
        const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

        function addLog(msg, isError = false) {
            const line = document.createElement('div');
            line.className = isError ? 'text-red-400' : 'text-neutral-300';
            line.textContent = msg;
            logBox.prepend(line);
        }

        // 1. Solidifica píxeles semitransparentes atrapados dentro de la prenda (ej. jeans lavados)
        function solidifyInterior(canvas) {
            const w = canvas.width;
            const h = canvas.height;
            const ctx = canvas.getContext('2d');
            const imageData = ctx.getImageData(0, 0, w, h);
            const data = imageData.data;

            // Mapa de fondo exterior conectado a los bordes del lienzo (flood fill desde los 4 bordes)
            const outside = new Uint8Array(w * h);
            const stack = [];

            for (let x = 0; x < w; x++) {
                if (data[(x) * 4 + 3] < 20) { outside[x] = 1; stack.push(x); }
                const bot = (h - 1) * w + x;
                if (data[bot * 4 + 3] < 20) { outside[bot] = 1; stack.push(bot); }
            }
            for (let y = 0; y < h; y++) {
                const left = y * w;
                if (data[left * 4 + 3] < 20) { outside[left] = 1; stack.push(left); }
                const right = y * w + (w - 1);
                if (data[right * 4 + 3] < 20) { outside[right] = 1; stack.push(right); }
            }

            while (stack.length > 0) {
                const idx = stack.pop();
                const x = idx % w;
                const y = (idx - x) / w;

                const neighbors = [];
                if (x > 0) neighbors.push(idx - 1);
                if (x < w - 1) neighbors.push(idx + 1);
                if (y > 0) neighbors.push(idx - w);
                if (y < h - 1) neighbors.push(idx + w);

                for (let i = 0; i < neighbors.length; i++) {
                    const n = neighbors[i];
                    if (!outside[n] && data[n * 4 + 3] < 20) {
                        outside[n] = 1;
                        stack.push(n);
                    }
                }
            }

            // Todo píxel que NO pertenece al fondo exterior y tiene algo de color (alpha > 10)
            // se vuelve 100% opaco (255), eliminando el efecto "fantasma" en jeans claros
            for (let i = 0; i < w * h; i++) {
                if (!outside[i] && data[i * 4 + 3] > 10) {
                    data[i * 4 + 3] = 255;
                }
            }

            ctx.putImageData(imageData, 0, 0);
        }

        // 2. Recorta aire sobrante y aplica margen óptimo según proporción
        function smartTrimCanvas(sourceCanvas) {
            const w = sourceCanvas.width;
            const h = sourceCanvas.height;
            const ctx = sourceCanvas.getContext('2d');
            const imgData = ctx.getImageData(0, 0, w, h).data;

            let minX = w, minY = h, maxX = 0, maxY = 0;
            let hasPixels = false;

            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    const alpha = imgData[(y * w + x) * 4 + 3];
                    if (alpha > 20) {
                        hasPixels = true;
                        if (x < minX) minX = x;
                        if (x > maxX) maxX = x;
                        if (y < minY) minY = y;
                        if (y > maxY) maxY = y;
                    }
                }
            }

            if (!hasPixels) return sourceCanvas;

            const cropW = maxX - minX + 1;
            const cropH = maxY - minY + 1;
            const aspect = cropW / cropH;

            const padRatio = aspect > 1.25 ? 0.12 : 0.06;
            const padX = Math.round(cropW * padRatio);
            const padY = Math.round(cropH * padRatio);

            const outW = cropW + padX * 2;
            const outH = cropH + padY * 2;

            const outCanvas = document.createElement('canvas');
            outCanvas.width = outW;
            outCanvas.height = outH;
            outCanvas.getContext('2d').drawImage(sourceCanvas, minX, minY, cropW, cropH, padX, padY, cropW, cropH);

            return outCanvas;
        }

        async function blobToRepairedWebpFile(blob, baseName) {
            const bitmap = await createImageBitmap(blob);
            const rawCanvas = document.createElement('canvas');
            rawCanvas.width = bitmap.width;
            rawCanvas.height = bitmap.height;
            rawCanvas.getContext('2d').drawImage(bitmap, 0, 0);
            bitmap.close();

            solidifyInterior(rawCanvas);
            const trimmedCanvas = smartTrimCanvas(rawCanvas);

            const maxSide = 1200;
            let finalW = trimmedCanvas.width;
            let finalH = trimmedCanvas.height;
            if (finalW > maxSide || finalH > maxSide) {
                const ratio = Math.min(maxSide / finalW, maxSide / finalH);
                finalW = Math.round(finalW * ratio);
                finalH = Math.round(finalH * ratio);
            }

            const finalCanvas = document.createElement('canvas');
            finalCanvas.width = finalW;
            finalCanvas.height = finalH;
            finalCanvas.getContext('2d').drawImage(trimmedCanvas, 0, 0, finalW, finalH);

            const webpBlob = await new Promise(res => finalCanvas.toBlob(res, 'image/webp', 0.86));
            return new File([webpBlob], `${baseName}.webp`, { type: 'image/webp' });
        }

        startBtn.addEventListener('click', async () => {
            if (!ITEMS.length) return;
            startBtn.disabled = true;
            startBtn.textContent = 'Reparando y ajustando...';

            for (let i = 0; i < ITEMS.length; i++) {
                const item = ITEMS[i];
                statusText.textContent = `Procesando: ${item.nombre}`;
                counterText.textContent = `${i + 1} / ${ITEMS.length}`;
                progressBar.style.width = `${Math.round(((i + 1) / ITEMS.length) * 100)}%`;

                try {
                    const imgRes = await fetch(item.url + '?v=' + Date.now());
                    const origBlob = await imgRes.blob();
                    const webpFile = await blobToRepairedWebpFile(origBlob, `prenda_${item.id}`);

                    const previewUrl = URL.createObjectURL(webpFile);
                    previewImg.src = previewUrl;
                    previewImg.classList.remove('hidden');

                    const formData = new FormData();
                    formData.append('imagen', webpFile);

                    const uploadRes = await fetch(`/panel/recorte-masivo/${item.id}/`, {
                        method: 'POST',
                        headers: { 'X-CSRFToken': csrfToken },
                        body: formData
                    });
                    const data = await uploadRes.json();

                    if (data.ok) {
                        addLog(`✓ [${i + 1}/${ITEMS.length}] ${item.nombre} (${Math.round(webpFile.size / 1024)} KB)`);
                    } else {
                        addLog(`✕ Error en ${item.nombre}: ${data.error}`, true);
                    }
                    URL.revokeObjectURL(previewUrl);
                } catch (err) {
                    addLog(`✕ Fallo en ${item.nombre}: ${err.message}`, true);
                }
            }

            statusText.textContent = '¡Reparación y ajuste completados!';
            startBtn.textContent = 'Finalizado';
            addLog('Listo. Todas las prendas tienen opacidad sólida y tamaño óptimo.');
        });
    </script>
</body>
</html>
